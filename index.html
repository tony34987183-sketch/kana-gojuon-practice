<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>五十音隨機練習</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f7dfe2'/%3E%3Cpath d='M13 26 11 11l16 9c4-1 7-1 11 0l15-9-2 16c2 4 3 8 2 13-2 10-11 16-21 16S13 49 11 39c-1-5 0-9 2-13Z' fill='%23fffaf6' stroke='%235d544f' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cellipse cx='24' cy='34' rx='2.2' ry='3' fill='%235d544f'/%3E%3Cellipse cx='41' cy='34' rx='2.2' ry='3' fill='%235d544f'/%3E%3Cpath d='m30 40 3 2 3-2M33 42c-1 3-4 4-6 2m6-2c1 3 4 4 6 2' fill='none' stroke='%235d544f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cellipse cx='18' cy='40' rx='4' ry='2' fill='%23f2a6ae' opacity='.75'/%3E%3Cellipse cx='48' cy='40' rx='4' ry='2' fill='%23f2a6ae' opacity='.75'/%3E%3C/svg%3E">
<style>
html{zoom:1.5;height:100%;overflow:hidden}body{height:100%;overflow:hidden}
:root{color-scheme:light;--ink:#262720;--muted:#77796f;--paper:#faf9f5;--card:#fffefa;--line:#e8e5db;--green:#476b55;--soft:#edf3ed;--red:#ac5f4c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:26px 16px}.app{width:min(100%,540px)}header{text-align:center;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--green);font-weight:700}h1{font-size:clamp(25px,6vw,34px);margin:8px 0 6px;letter-spacing:.04em}.sub{margin:0;color:var(--muted);font-size:14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 34px #39341b0b}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;color:#66685f;font:inherit;font-size:13px;cursor:pointer}.chip.active{background:var(--soft);border-color:#cbd9ce;color:var(--green);font-weight:650}.stage{position:relative;min-height:236px;border-radius:17px;background:#f6f5ef;display:grid;place-items:center;text-align:center;overflow:hidden}.stage:before,.stage:after{content:"";position:absolute;width:130px;height:130px;border:1px solid #e9e7de;border-radius:50%;pointer-events:none}.stage:before{left:-75px;top:-72px}.stage:after{right:-80px;bottom:-85px}.kana{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(100px,24vw,144px);line-height:1;color:#292a24;transition:transform .18s,opacity .18s}.kana.pop{animation:pop .24s ease-out}@keyframes pop{from{transform:scale(.84);opacity:.45}to{transform:scale(1);opacity:1}}.answer{position:absolute;bottom:20px;font-size:15px;color:var(--green);font-weight:650;letter-spacing:.08em;min-height:22px}.answer.hidden{visibility:hidden}.actionrow{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:9px;margin:16px 0}.btn{touch-action:manipulation;min-height:46px;border-radius:12px;border:1px solid var(--line);background:white;color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:transform .12s,background .12s}.btn:hover{background:#f6f5ef}.btn:active{transform:scale(.98)}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.primary:hover{background:#3d5e49}.inputrow{display:flex;gap:9px}.inputrow input{flex:1;min-width:0;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:16px;outline:none;background:#fff}.inputrow input:focus{border-color:#91aa97;box-shadow:0 0 0 3px #476b5514}.inputrow input::placeholder{color:#a3a49c}.status{min-height:24px;text-align:center;font-size:13px;margin-top:10px;color:var(--muted)}.status.good{color:var(--green);font-weight:600}.status.bad{color:var(--red)}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;color:var(--muted);font-size:13px}.score{display:flex;gap:14px}.score b{color:var(--ink);font-weight:650}.reset{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.hint{text-align:center;margin:17px 0 0;color:#92938b;font-size:12px}@media(max-width:420px){.panel{padding:17px}.stage{min-height:215px}.actionrow{grid-template-columns:1fr 1.2fr}.actionrow .skip{grid-column:span 2;grid-row:2;min-height:40px}.footer{font-size:12px}}
.stage:before,.stage:after{display:none}.kana.hidden{visibility:hidden}.stroke{position:absolute;width:155px;height:155px;left:50%;top:46%;transform:translate(-50%,-50%);object-fit:contain}.stroke.hidden{display:none}.cycle{text-align:center;color:#77796f;font-size:12px;margin:10px 0 -5px}
body{place-items:start center}
</style>
</head>
<body><main class="app">
<section class="panel">
<nav class="controls" aria-label="假名種類"><button class="chip active" data-mode="hiragana">平假名</button><button class="chip" data-mode="katakana">片假名</button><button class="chip" data-mode="voiced">濁音</button><button class="chip" data-mode="mixed">清音混合</button><button class="chip" data-mode="all">全混合</button></nav>
<div class="stage" aria-live="polite"><div class="kana" id="kana">あ</div><img class="stroke hidden" id="stroke" alt="目前假名的筆順動畫"><div class="answer hidden" id="answer"></div></div>
<div class="actionrow"><button class="btn" id="show">顯示拼音</button><button class="btn primary" id="next">換一個</button><button class="btn" id="strokeToggle" aria-pressed="false">顯示筆畫</button></div>
</section></main>
<script>
const rows=[['あ','い','う','え','お'],['か','き','く','け','こ'],['さ','し','す','せ','そ'],['た','ち','つ','て','と'],['な','に','ぬ','ね','の'],['は','ひ','ふ','へ','ほ'],['ま','み','む','め','も'],['や','','ゆ','','よ'],['ら','り','る','れ','ろ'],['わ','','','','を'],['ん','','','','']];
const sounds=[['a','i','u','e','o'],['ka','ki','ku','ke','ko'],['sa','shi','su','se','so'],['ta','chi','tsu','te','to'],['na','ni','nu','ne','no'],['ha','hi','fu','he','ho'],['ma','mi','mu','me','mo'],['ya','','yu','','yo'],['ra','ri','ru','re','ro'],['wa','','','','o'],['n','','','','']];
const kana=rows.flatMap((row,i)=>row.map((h,j)=>h?{h,r:sounds[i][j]}:null).filter(Boolean));
const voicedRows=[['が','ぎ','ぐ','げ','ご'],['ざ','じ','ず','ぜ','ぞ'],['だ','ぢ','づ','で','ど'],['ば','び','ぶ','べ','ぼ'],['ぱ','ぴ','ぷ','ぺ','ぽ']];
const voicedSounds=[['ga','gi','gu','ge','go'],['za','ji','zu','ze','zo'],['da','ji','zu','de','do'],['ba','bi','bu','be','bo'],['pa','pi','pu','pe','po']];
const voiced=voicedRows.flatMap((row,i)=>row.map((h,j)=>({h,r:voicedSounds[i][j]})));
const toKata=h=>String.fromCharCode(h.charCodeAt(0)+0x60);
let mode='hiragana',current,spaceTimer=null,spaceDelay=null,strokeVisible=false;
const decks={};
const kanaEl=document.querySelector('#kana'),answerEl=document.querySelector('#answer'),strokeEl=document.querySelector('#stroke'),strokeToggle=document.querySelector('#strokeToggle');
function poolFor(mode){if(mode==='hiragana'||mode==='katakana'||mode==='mixed')return kana;if(mode==='voiced')return voiced;return [...kana,...voiced]}
function refillDeck(mode){decks[mode]=[...poolFor(mode)];for(let i=decks[mode].length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[decks[mode][i],decks[mode][j]]=[decks[mode][j],decks[mode][i]]}}
function renderCurrent(){let displayed=current.h;if(mode==='katakana'||((mode==='mixed'||mode==='voiced'||mode==='all')&&Math.random()<0.5))displayed=toKata(displayed);kanaEl.textContent=displayed;kanaEl.classList.remove('pop');void kanaEl.offsetWidth;kanaEl.classList.add('pop');answerEl.textContent=current.r;answerEl.classList.add('hidden');strokeEl.src=`https://raw.githubusercontent.com/parsimonhi/animCJK/master/svgsJaKana/${displayed.charCodeAt(0)}.svg`;strokeEl.classList.toggle('hidden',!strokeVisible);kanaEl.classList.toggle('hidden',strokeVisible);strokeToggle.setAttribute('aria-pressed',String(strokeVisible))}
function draw(){if(!decks[mode]||decks[mode].length===0)refillDeck(mode);current=decks[mode].pop();strokeVisible=false;renderCurrent()}
function toggleStroke(){strokeVisible=!strokeVisible;if(strokeVisible){const glyph=kanaEl.textContent;strokeEl.src=`https://raw.githubusercontent.com/parsimonhi/animCJK/master/svgsJaKana/${glyph.charCodeAt(0)}.svg?replay=${Date.now()}`}kanaEl.classList.toggle('hidden',strokeVisible);strokeEl.classList.toggle('hidden',!strokeVisible);strokeToggle.setAttribute('aria-pressed',String(strokeVisible))}
document.querySelector('#show').addEventListener('click',()=>answerEl.classList.toggle('hidden'));document.querySelector('#next').addEventListener('click',draw);strokeToggle.addEventListener('click',toggleStroke);document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{document.querySelector('.chip.active').classList.remove('active');b.classList.add('active');mode=b.dataset.mode;draw()}));document.addEventListener('keydown',e=>{if(e.code==='KeyZ'&&!e.repeat){answerEl.classList.toggle('hidden')}if(e.code==='KeyX'&&!e.repeat){toggleStroke()}if(e.code==='KeyC'&&!e.repeat){const chips=[...document.querySelectorAll('.chip')];const active=chips.findIndex(b=>b.classList.contains('active'));chips[(active+1)%chips.length].click()}if(e.code==='Space'){e.preventDefault();if(!spaceDelay&&!spaceTimer){draw();spaceDelay=setTimeout(()=>{spaceDelay=null;spaceTimer=setInterval(draw,10)},300)}}});function stopSpace(){if(spaceDelay){clearTimeout(spaceDelay);spaceDelay=null}if(spaceTimer){clearInterval(spaceTimer);spaceTimer=null}}document.addEventListener('keyup',e=>{if(e.code==='Space')stopSpace()});window.addEventListener('blur',stopSpace);draw();
</script></body></html>
